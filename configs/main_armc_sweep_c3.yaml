# Arm C sweep, candidate C3 - view diversity, crop form: C1 plus a second *view* of sag_fs at a
# 90 mm field, the "meniscus specialist" of architecture §2.2. It is derived from the same
# cached 130 mm/384 px volume (centre 69.2 %, upscaled back to 384: ~8 % below native
# resolution, no second cache), gets its own [MISSING] vector and aux head, and is sampled with
# its own K centres, so it is a different look at the same series rather than a duplicate.
# Public prior art uses exactly this (research.md §2: 90 mm for the sagittal fluid slot).
run_id: armc_sweep_c3
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1, sag_fs]
  view_crop_mm: [130.0, 130.0, 130.0, 130.0, 90.0]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 2
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
