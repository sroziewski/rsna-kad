# Arm N1 - the CONSERVATIVE per-label attention head (competitor analysis §7 A2).
#
# Identical to configs/main_armn_base_384.yaml except `model.head`. The head keeps §2.4's
# read-out (per-slot gated attention -> [MISSING]-filled concat + presence bits -> MLP -> 12
# logits) as the baseline and adds `gate[label] * delta[label]`, where delta comes from 12
# attention distributions - one per finding - over the whole bag of S slot summaries + S*K
# triplet tokens, with the anatomical prior (model.SLOT_PRIOR) added to the attention logits
# before the softmax. This is the competitor's CodexResidualPool/_GatedDelta shape: `base +
# gate * delta` with `gate` initialised to zero, so the arm starts life numerically equal to
# the baseline and can only ever perturb it. It is the variant to try first precisely because
# its failure mode is "gate stays near zero", not "a worse model".
run_id: main_armn_residual_384
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1, sag_fs]
  view_crop_mm: [130.0, 130.0, 130.0, 130.0, 90.0]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  head: per_label_residual
  label_attn_hidden: 256
  label_attn_drop: 0.2
  slot_prior_strength: 0.55
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v1_1_gemma3
folds_csv: data/folds/folds_v1.csv
epochs: 8
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 2
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
