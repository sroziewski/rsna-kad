# Arm D sweep, candidate D3 - D1 plus arm C's 90 mm sagittal view: 6 views over the same 4
# series (sag_fs and cor_fs are each read once and cropped twice).
#
# This is the "optional sagittal view" of the arm D brief, and the only candidate whose cost is
# genuinely in question. It must not be read as a repeat of the arm C sweep's C4, which also had
# 6 views but over *five* series: C4 paid twice - a fifth series to load (cor_t1, missing in
# 22.7 % of studies) and a new modality to converge on - and landed at train loss 0.7274/78 s
# per 200-study epoch against C3's 0.7143/36 s. Here the I/O is D1's exactly and only the
# backbone's image count rises 5 -> 6, so the expected penalty is ~20 % of GPU time and nothing
# on convergence. If that is what the run shows, D3 is the stronger arm: it keeps the sagittal
# repair of synovitis that arm C demonstrated while adding the coronal repair this arm is for.
#
# Decision rule stated before the runs, so the sweep cannot be read after the fact: take D3 over
# D1 if its epoch-1 train loss is within 0.005 of D1's, its peak memory stays under the 30 GB we
# may hold on a shared GPU 1, and its per-epoch wall time is within 25 % of D1's. Otherwise D1.
# Inference cost is the tie-breaker against D3 in one direction only - 6 views is 1.5x arm A per
# study - and §2.7 decides that against the measured Kaggle runtime, not here.
run_id: armd_sweep_d3
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1, cor_fs, sag_fs]
  view_crop_mm: [130.0, 130.0, 130.0, 130.0, 100.0, 90.0]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 2
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
