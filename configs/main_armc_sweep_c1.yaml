# Arm C sweep, candidate C1 - the control: convnextv2_tiny.fcmae_ft_in22k_in1k_384 on arm A's
# exact 4 slots and 130 mm view. It measures what a pure backbone swap buys (research.md §2:
# +0.001 historically), so C2-C4 can be read as "what the extra views buy on top of it".
#
# Backbone choice (stage-8 arm B post-mortem): LayerNorm/GRN only - no BatchNorm to be
# double-updated by gradient checkpointing; 28 M params (vs arm A's 50 M) and ~1.8x arm A's
# throughput, which is what pays for the extra views in C2-C4; FCMAE self-supervised + in22k
# fine-tune at 384 is a different pretraining objective from arm A's supervised in22k, and the
# plain flat lr 1e-4 that underfit CoAtNet is the recipe convnext was tuned with in arm A.
#
# Run: scripts/train.py --config <this> --fold 0 --gpu 1 --limit 200  (2 epochs, ~10 min)
# Gate: arm A's own 200-study smoke (runs/main_smoke_384) = weak 0.6993, strict 0.6628,
# gold 0.6803, train_loss 0.7091 at epoch 1, 161 img/s, 15.7 GB.
run_id: armc_sweep_c1
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1]
  view_crop_mm: []
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 2
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
