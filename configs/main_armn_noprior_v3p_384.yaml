# Arm N3 - the ABLATION that separates the two halves of A2.
# v3p variant (2026-09-26): targets v3_pseudo, i.e. the pseudo-label students' table. Its control is
# C_p = runs/main_armc_convnextv2_t_384_p (configs/main_armc_pseudo.yaml), which differs from this
# file only in run_id and model.head - so no separate arm-N baseline is trained for v3p.
#
# A2 bundles two ideas: (a) one attention distribution per finding instead of one shared over
# all of them, and (b) an anatomical (label, slot) prior added to those attention logits. If the
# arm wins, this run says which half paid: it is the better of N1/N2 with
# `slot_prior_strength: 0.0`, which makes model.prior_matrix return zeros - an exact no-op in the
# softmax, so the head is per-label attention with no anatomy in it. Everything else, including
# the seed, is byte-identical to that arm's config.
#
# Head set to per_label_residual after the fold-0 triage (qa/stage11/report.md §3).
run_id: main_armn_noprior_v3p_384
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1, sag_fs]
  view_crop_mm: [130.0, 130.0, 130.0, 130.0, 90.0]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  head: per_label_residual
  label_attn_hidden: 256
  label_attn_drop: 0.2
  slot_prior_strength: 0.0
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v3_pseudo
folds_csv: data/folds/folds_v1.csv
epochs: 8
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 2
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
