# Arm C sweep, candidate C2 - view diversity, slot form: C1 plus the 5th slot `cor_t1`
# (architecture §2.2 "optional 5th cor_t1"; present in 77 % of studies, the learned [MISSING]
# vector covers the other 23 %). Coronal T1/PD is the view MCL and the meniscal roots are read
# on, and MCL is our second-weakest label (arm A OOF 0.869), so this aims at a named gap
# instead of at generic capacity.
run_id: armc_sweep_c2
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1, cor_t1]
  view_crop_mm: []
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 2
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
