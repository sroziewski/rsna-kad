# Arm C sweep, candidate C4 - both view additions: C1 + cor_t1 (C2) + sag_fs @ 90 mm (C3),
# i.e. 6 views over 5 distinct series. This is the arm the design argues for (research.md §2-3:
# view/label diversity beats backbone diversity - backbone swaps on identical views gave +0.001,
# a different view gave more), and convnextv2_tiny's throughput is what keeps 6 views at arm A's
# cost per fold. C1-C3 exist to attribute whatever it gains.
run_id: armc_sweep_c4
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1, cor_t1, sag_fs]
  view_crop_mm: [130.0, 130.0, 130.0, 130.0, 130.0, 90.0]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 2
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
