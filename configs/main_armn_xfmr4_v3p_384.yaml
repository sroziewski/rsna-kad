# Arm N-xfmr4 - the DEEP per-label head (user request, 2026-09-26): depth-4 counterpart of the
# depth-1 per-label heads of arm N, on the same targets (v3_pseudo) and the same recipe as C_p
# (runs/main_armc_convnextv2_t_384_p, configs/main_armc_pseudo.yaml), which differs from this file
# only in run_id and the head block - C_p is the paired control, judged on gold-58 and on the
# main_v4 blend (Ap+Ep+Cp) under §4.2.
#
# Head `per_label_xfmr`: the per-label bag (S slot summaries with the [MISSING] vectors + S*K
# triplet tokens) is projected 768 -> 384, given learned view embeddings and a Fourier encoding of
# each triplet's normalised depth position, and run through a 4-layer pre-norm transformer encoder
# (6 heads, MLP ratio 4, attention dropout 0.1) with stochastic depth rising linearly 0 -> 0.15
# over the layers, key-padding-masked for absent slots. The existing 12-label attention read-out
# with the anatomical prior (strength 0.55) then gives the 12 logits; presence bits get per-label
# weights; per-slot aux heads unchanged. Straight to 5 folds (no fold-0 triage: fold 0 has only
# ~11 gold rows, and GPU 1 would otherwise idle).
#
#   CUDA_VISIBLE_DEVICES=1 bash scripts/run_screen.sh xfmr_q bash qa/stage11/queue_xfmr4.sh
run_id: main_armn_xfmr4_v3p_384
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1, sag_fs]
  view_crop_mm: [130.0, 130.0, 130.0, 130.0, 90.0]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  head: per_label_xfmr
  label_attn_hidden: 256
  label_attn_drop: 0.2
  slot_prior_strength: 0.55
  xfmr_layers: 4
  xfmr_dim: 384
  xfmr_heads: 6
  xfmr_mlp_ratio: 4.0
  xfmr_attn_drop: 0.1
  xfmr_drop_path: 0.15
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v3_pseudo
folds_csv: data/folds/folds_v1.csv
epochs: 8
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 2
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
