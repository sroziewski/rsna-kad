# Arm D sweep, candidate D0 - the control, byte-identical in model terms to armc_sweep_c1:
# convnextv2_tiny.fcmae_ft_in22k_in1k_384 on arm A's 4 slots at the full 130 mm field.
#
# It is re-run rather than quoted because two of the three decision axes of the arm-C sweep
# method (architecture §4.1: train loss, throughput, memory - never smoke AUC, whose noise
# floor at 200 studies is +-0.04) are properties of the machine, and GPU 1 carries a different
# co-tenant now than it did at 17:00 on 2026-09-21. The recorded pair to reproduce is
# armc_sweep_c1 epoch 1: loss 0.7091, 210 img/s, 11.3 GB; the arm A gate it was measured
# against is runs/main_smoke_384 epoch 1: loss 0.7091, 161 img/s, 15.7 GB.
#
# Run: python scripts/train.py --config <this> --fold 0 --gpu 1 --limit 200
run_id: armd_sweep_d0
cache:
  version: v1
model:
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1]
  view_crop_mm: []
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 2
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
