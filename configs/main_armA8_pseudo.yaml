# Pseudo-label round v3, arm A lane (qa/pseudo_v3/report.md): configs/main_convnext_s_384_e8.yaml
# verbatim except run_id and targets_version (v3_pseudo = v1_1 mixed 0.5/0.5 with the main_v3
# teacher on every cell). Judge on paired gold-58 / LB of main_v4 vs main_v3, not weak-OOF.
run_id: main_convnext_s_384_e8_p
cache:
  version: v1
model:
  backbone: convnext_small.fb_in22k_ft_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.2
  grad_checkpoint: true
targets_version: v3_pseudo
folds_csv: data/folds/folds_v1.csv
epochs: 8
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
