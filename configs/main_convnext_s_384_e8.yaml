# Arm A with an 8-epoch schedule. Byte-identical to configs/main_convnext_s_384.yaml except
# `epochs` and `run_id`; the cosine decay is recomputed over 8 epochs by train.py (total_steps =
# epochs x steps_per_epoch) and the 1-epoch warmup is unchanged, so this is a fully annealed
# 8-epoch run, not a truncation of the 12-epoch one.
#
# Why 8: all five recorded arm-A folds peaked on validation at epoch 4-7 and then declined to the
# last epoch (f0 ep6 .9292 -> ep11 .9207, f1 ep7 .9300 -> .9238, f2 ep6 .9444 -> .9366,
# f3 ep6 .9411 -> .9357, f4 ep4 .9285 -> .9170). Selecting the best epoch on the validation fold
# would buy that back dishonestly (stage-3 F1: ~+0.008 optimism), so the schedule is shortened
# a priori instead. The number 8 is fixed once from those five curves and is never re-tuned per
# fold: `select_epoch: last` therefore stays an out-of-sample estimate for every fold.
run_id: main_convnext_s_384_e8
cache:
  version: v1
model:
  backbone: convnext_small.fb_in22k_ft_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.2
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 8
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
