# Targets v1.1: identical to targets_v1.yaml in every calibration and weight parameter -
# fold-local empirical-Bayes calibration (Beta prior strength 8), PAVA monotonicity, the same
# per-label weights and the same under-reported-key handling. The ONLY change is the label
# table it is applied to: a fourth voter enters as `_v3`, so `make_targets` averages three
# mapped values per cell instead of two and grades the weight by the majority share
# (labels/targets.py). Keeping this file a copy is deliberate: any delta measured against
# targets v1 must be attributable to the voter set alone.
version: v1_1
prior_strength: 8
calibrate: true
base:
  affirmed: 0.92
  affirmed_mild:
    default: 0.35
    med_men: 0.25
    lat_men: 0.25
    effusion: 0.25
    baker: 0.25
    mcl: 0.20
    acl: 0.35
    med_oa: 0.35
    lat_oa: 0.35
    pf_oa: 0.35
    contusion: 0.70
    fracture: 0.70
  hedged: 0.50
  negated: 0.04
  absent_well_reported: 0.06
  absent_under_reported: 0.15
weights:
  affirmed: 1.0
  negated: 1.0
  hedged: 0.7
  absent_well_reported: 0.5
  absent_under_reported: 0.1
  parse_fail: 0.2
  postoperative: 0.2
  hallucinated_evidence: 0.3
  disagreement: 0.5
