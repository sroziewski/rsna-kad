# NOT A CANDIDATE: written for a licence alarm that was withdrawn (competition winner licence is
# CC-BY-NC-4.0, rule 5.a.4). Kept only as the record of the one smoke it ran.
# Smoke for arm C' (sanity of throughput, memory and train loss before a ~10 h chain). It runs
# 2 epochs on targets v1, not 1 epoch on v1_1_gemma3, because the check asked for - train loss
# against arm A's recorded smoke 0.7091 - is only defined for that setup: 0.7091 is epoch 1 of a
# 2-epoch run on v1 (a 1-epoch run has a different cosine and reads ~0.75), and a different target
# table changes the loss scale. Same views as arm C's sweep candidate C3 (convnextv2, 0.7143,
# 299 img/s, 14.0 GB), so the backbone swap is read directly against it.
run_id: armcp_smoke
cache:
  version: v1
model:
  backbone: convnext_tiny.fb_in22k_ft_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1, sag_fs]
  view_crop_mm: [130.0, 130.0, 130.0, 130.0, 90.0]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.1
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 2
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
