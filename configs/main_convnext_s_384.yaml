# Main arm A (architecture §2.4): convnext_small.fb_in22k_ft_in1k_384 @384, 4 slots (MAIN_SLOTS),
# K 12 train / 24 infer, 12 epochs, calibrated targets v1 (data/targets/v1, gold excluded), last-epoch
# selection (stage-3 finding F1). K 12 is the §2.4 fallback: K 16 measured 3.9-4.6 h/fold on GPU 0,
# K 12 ~3.2 h. Batch 4 studies x 4 slots x 12 = 192 images per step. cudnn autotune off + compiled
# backbone: 210 img/s vs 74 img/s in the first smoke (autotune re-ran for every batch shape).
run_id: main_convnext_s_384
cache:
  version: v1
model:
  backbone: convnext_small.fb_in22k_ft_in1k_384
  img_px: 384
  crop_mm: 130.0
  slots: [sag_fs, cor_fs, ax_fs, sag_t1]
  k_train: 12
  k_infer: 24
  attn_hidden: 256
  fusion_hidden: 512
  aux_weight: 0.3
  drop_rate: 0.1
  drop_path: 0.2
  grad_checkpoint: true
targets_version: v1
folds_csv: data/folds/folds_v1.csv
epochs: 12
batch_studies: 4
lr_backbone: 1.0e-4
lr_heads: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1.0
ema_decay: 0.999
grad_clip: 2.0
num_workers: 12
seed: 2026
sibling_p: 0.3
slot_dropout_p: 0.1
mixup_p: 0.3
mixup_alpha: 0.4
crop_scale_mm: [115.0, 130.0]
rot_deg: 8.0
bc_jitter: 0.03
amp_dtype: bfloat16
eval_batch_studies: 4
select_epoch: last
cudnn_benchmark: false
compile_backbone: true
